<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0B0D">
<title>Gálatas — Panel de rutinas</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
body{margin:0;background:#0B0B0D}
a{color:#F0414A}a:hover{color:#FF6B72}
/* ===== Base: misma identidad que la app del socio (negro, rojo marca #D9232D, Anton + Poppins) ===== */
.pg{position:relative;min-height:100vh;display:flex;flex-wrap:wrap;background:radial-gradient(70% 50% at 100% 0%,rgba(150,18,26,.22),rgba(150,18,26,0) 60%),#0B0B0D;color:#F5F5F6;font-family:'Poppins',system-ui,sans-serif;font-size:14.5px;line-height:1.5}
.pg *{box-sizing:border-box}
.side{flex:1 1 240px;max-width:100%;background:#0E0E11;border-right:1px solid #1E1E23;padding:20px 14px;display:flex;flex-direction:column;gap:3px}
.main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;display:flex;flex-direction:column;gap:22px;animation:inUp .4s cubic-bezier(.2,.75,.25,1) both}
@keyframes inUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sec-t{font-weight:600;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#6F6F79;margin:16px 10px 4px}
.ni{appearance:none;border:0;background:transparent;color:#A6A6B0;display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border-radius:8px;font:500 14px 'Poppins',sans-serif;cursor:pointer;text-align:left;position:relative;transition:background-color .15s ease,color .15s ease}
.ni:hover{background:#17171B;color:#F5F5F6}
.ni.on{background:linear-gradient(90deg,#2A0C0F,rgba(42,12,15,0));color:#fff}
.ni.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#D9232D;box-shadow:0 0 12px rgba(217,35,45,.9)}
.ni.on svg{color:#F0414A}
.badge{margin-left:auto;background:#D9232D;color:#fff;border-radius:999px;font:400 12px/1 'Anton',sans-serif;letter-spacing:.04em;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.badge.gray{background:#26262C;color:#CFCFD6}
.h1{font-family:'Anton',sans-serif;font-weight:400;font-size:44px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.005em}
.h1::after{content:'';display:block;width:48px;height:4px;background:#D9232D;margin-top:14px;animation:dashIn .5s .15s cubic-bezier(.2,.75,.25,1) both}
@keyframes dashIn{from{width:0}to{width:48px}}
.h2{font-family:'Anton',sans-serif;font-weight:400;font-size:24px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.01em}
.h3{font-weight:600;font-size:15.5px;margin:0}
.mu{color:#A6A6B0;margin:0}
.sm{font-size:13px}
.p{margin:0}
.eyebrow{font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#F0414A;margin:0;display:block}
.eyebrow::before{content:'';display:inline-block;width:18px;height:2px;background:currentColor;vertical-align:middle;margin:-2px 10px 0 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.card{background:#141418;border:1px solid #24242A;border-radius:12px;padding:18px 20px}
/* ===== Botones ===== */
.btn{appearance:none;border:0;border-radius:8px;min-height:42px;padding:0 16px;font:600 12.5px 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;transition:transform .12s ease,background-color .15s ease,border-color .15s ease,box-shadow .15s ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:#D9232D;color:#fff;box-shadow:0 10px 24px -10px rgba(217,35,45,.7)}
.btn.pri:hover{background:#E8343E}
.btn.sec{background:#18181D;color:#F5F5F6;border:1px solid #303037}
.btn.sec:hover{border-color:#55555F}
.btn.ghost{background:transparent;color:#F0414A;padding:0 6px;text-transform:none;letter-spacing:0;font-size:14px;box-shadow:none}
.btn.sm{min-height:36px;padding:0 12px;font-size:11.5px}
.btn.ghost.sm{font-size:13.5px}
/* ===== Pestañas y tabla de pedidos ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid #24242A;flex-wrap:wrap}
.tab{appearance:none;border:0;background:transparent;color:#A6A6B0;font:600 14px 'Poppins',sans-serif;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center;transition:color .15s ease,border-color .15s ease}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:#D9232D;box-shadow:0 8px 14px -12px rgba(217,35,45,.9)}
.tblbox{overflow-x:auto;border:1px solid #24242A;border-radius:12px;background:#141418}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font:600 10.5px 'Poppins',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8C8C96;padding:12px 16px;border-bottom:1px solid #24242A;background:#111115}
td{padding:12px 16px;border-bottom:1px solid #1E1E23;vertical-align:middle}
tbody tr{animation:fadeIn .35s ease both}
tr:last-child td{border-bottom:0}
tr.hov td{transition:background-color .15s ease}
tr.hov:hover td{background:#18181D}
tr.sel td{background:#1E0B0D}
.who{white-space:nowrap;appearance:none;border:0;background:transparent;color:#F5F5F6;display:flex;align-items:center;gap:10px;cursor:pointer;padding:0;font:600 14.5px 'Poppins',sans-serif;text-align:left}
.av{width:34px;height:34px;border-radius:50%;background:#1E0B0D;border:1px solid #D9232D;color:#fff;display:inline-flex;align-items:center;justify-content:center;font:400 14px/1 'Anton',sans-serif;letter-spacing:.04em;flex:none}
.av.lg{width:56px;height:56px;font-size:22px}
.alert{color:#F5B35C;display:inline-flex}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;background:transparent;color:#D8D8DE;border:1px solid #3A3A42;white-space:nowrap}
.tag.red{background:#2A0C0F;color:#FF8A8F;border-color:#7A1A20}
.tag.warn{background:#2B1A08;color:#F5B35C;border-color:#6B4310}
.tag.ok{background:#0F2418;color:#7FD6A2;border-color:#1F5A37}
.grid2{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.colL{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:12px}
.colR{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
.dl .k{font-size:10.5px;font-weight:600;color:#8C8C96;text-transform:uppercase;letter-spacing:.14em;margin:0}
.dl .v{margin:2px 0 0;font-weight:500}
.dl .v.warn{color:#F5B35C}
.dl .full{grid-column:1 / -1}
.secn{font:400 18px/1 'Anton',sans-serif;color:#D9232D;margin-right:8px}
.sech{appearance:none;width:100%;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;text-align:left;font:inherit;min-height:56px;transition:background-color .15s ease}
.sech:hover{background:#17171B;border-radius:12px}
.subt{font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8C8C96;margin:0}
/* ===== Formularios ===== */
.inp{width:100%;background:#0F0F12;border:1px solid #2C2C33;border-radius:8px;min-height:40px;padding:8px 10px;color:#F5F5F6;font:500 14px 'Poppins',sans-serif;transition:border-color .15s ease,box-shadow .15s ease}
.inp:focus{outline:none;border-color:#D9232D;box-shadow:0 0 0 3px rgba(217,35,45,.22)}
.inp::placeholder{color:#6F6F79}
textarea.inp{min-height:110px;resize:vertical}
select.inp{cursor:pointer}
.lbl{display:block;font-size:10.5px;font-weight:600;color:#8C8C96;text-transform:uppercase;letter-spacing:.14em;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid #303037;background:transparent;color:#D8D8DE;border-radius:999px;min-height:34px;padding:0 12px;font:500 13.5px 'Poppins',sans-serif;cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.chip.on{background:#D9232D;border-color:#D9232D;color:#fff}
/* ===== Coincidencias del catálogo y pesos ===== */
.match{border:1px solid #24242A;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#111115;transition:border-color .15s ease}
.match.best{border-color:#D9232D;background:radial-gradient(120% 140% at 100% 0%,#3A0B10 0%,#141418 60%)}
.wt{display:flex;flex-direction:column}
.wrow{display:grid;grid-template-columns:minmax(0,1.6fr) 72px 130px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #1E1E23;font-size:14px}
.wrow.whead{border-top:0;padding-top:0;font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8C8C96}
.wcur{display:flex;align-items:center;gap:6px}
.dif{font:400 14px/1 'Anton',sans-serif;letter-spacing:.04em;min-width:44px}
.dif.up{color:#7FD6A2}
.dif.eq{color:#8C8C96}
.dif.down{color:#F5B35C}
/* ===== Editor de rutinas ===== */
.lib{flex:1 1 300px;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:12px}
.ed{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:14px}
.libl{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow-y:auto;padding-right:4px}
.libi{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#141418;border:1px solid #24242A;border-radius:10px;padding:8px 8px 8px 12px;transition:border-color .15s ease}
.libi:hover{border-color:#3A3A42}
.add{appearance:none;width:34px;height:34px;border-radius:8px;border:1px solid #7A1A20;background:#2A0C0F;color:#FF8A8F;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none;transition:background-color .15s ease,transform .12s ease}
.add:hover{background:#D9232D;color:#fff}
.add:active{transform:scale(.92)}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.dtab{appearance:none;border:1px solid #303037;background:#141418;color:#A6A6B0;border-radius:8px;min-height:40px;padding:0 16px;font:400 15px 'Anton',sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:background-color .15s ease,color .15s ease}
.dtab.on{background:#D9232D;border-color:#D9232D;color:#fff;box-shadow:0 8px 18px -10px rgba(217,35,45,.8)}
.erow{display:grid;grid-template-columns:minmax(200px,2.2fr) 70px 90px 110px minmax(180px,3fr) 36px;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid #1E1E23}
.ehead{border-top:0;color:#8C8C96;font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding-top:10px;padding-bottom:6px}
.egrp{font-weight:600;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#F0414A;padding:14px 12px 4px;border-top:1px solid #24242A;display:flex;align-items:center;gap:10px}
.egrp::before{content:'';width:18px;height:2px;background:#D9232D;flex:none}
.etbl{background:#141418;border:1px solid #24242A;border-radius:12px;overflow-x:auto}
.etbl-in{min-width:820px}
.del{appearance:none;width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:#6F6F79;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none;transition:background-color .15s ease,color .15s ease}
.del:hover{background:#2A0C0F;color:#FF8A8F}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{position:absolute;top:20px;right:24px;z-index:10;background:rgba(20,20,24,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #1F5A37;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.55);animation:toastIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
.okc{width:30px;height:30px;border-radius:50%;background:#1F5A37;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.back{appearance:none;border:0;background:transparent;color:#A6A6B0;font:600 13.5px 'Poppins',sans-serif;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:6px;min-height:32px;transition:color .15s ease}
.back:hover{color:#fff}
.empty{padding:40px;text-align:center;color:#8C8C96;margin:0}
.demobar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px dashed #3A3A42;border-radius:10px;padding:8px 12px;background:rgba(14,14,17,.8)}
.demot{font-weight:600;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#8C8C96;margin:0}
.seg2{display:inline-flex;background:#121216;border:1px solid #2C2C33;border-radius:10px;padding:3px;gap:3px}
.seg2 button{appearance:none;border:0;background:transparent;color:#A6A6B0;border-radius:7px;min-height:34px;padding:0 14px;font:600 12.5px 'Poppins',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background-color .2s ease,color .2s ease}
.seg2 button.on{background:#D9232D;color:#fff;box-shadow:0 6px 16px -8px rgba(217,35,45,.85)}
.dex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-top:1px solid #1E1E23}
.why{grid-column:1 / -1;margin:0;color:#A6A6B0;font-size:13px;display:flex;gap:6px;align-items:flex-start}
.why svg{flex:none;margin-top:2px;color:#F0414A}
.chk{display:flex;gap:8px;align-items:flex-start}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;border-top:1px solid #222228;padding-top:12px}
.rule{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border:1px solid #24242A;border-radius:10px;background:#111115;transition:border-color .15s ease,background-color .15s ease}
.rule.on{border-color:#D9232D;background:#1E0B0D}
.note{display:flex;gap:12px;align-items:flex-start;background:#111115;border:1px solid #24242A;border-radius:10px;padding:12px 16px;color:#CFCFD6;font-size:14px;margin:0}
.note svg{flex:none;margin-top:1px;color:#F0414A}
.warnbox{border:1px solid #6B4310;background:#1A1209;border-radius:10px;padding:12px 14px;color:#F5D7A8;font-size:14px;margin:0}
.drop{border:2px dashed #3A3A42;border-radius:14px;background:#0F0F12;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:border-color .2s ease}
.drop:hover{border-color:#D9232D}
/* ===== Plano a escala (el mismo dibujo que ve el socio, 1,5 veces más grande: cada cuadro = 1 m = 30px) ===== */
.plan{position:relative;width:522px;max-width:100%;height:630px;background-color:#0E0E11;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:30px 30px;border:1px solid #24242A;border-radius:12px;overflow:hidden;cursor:crosshair;flex:none}
.lyr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wall path{stroke-dasharray:1 1;animation:draw 1.3s cubic-bezier(.6,0,.3,1) .1s both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.led path{animation:ledOn 1.3s 1.2s ease both}
@keyframes ledOn{0%{opacity:0}18%{opacity:.95}26%{opacity:.2}38%{opacity:1}52%{opacity:.6}64%{opacity:1}100%{opacity:1}}
.maq g{animation:fadeIn .5s ease both}
.zone{position:absolute;border:1px dashed #3A3A42;border-radius:12px;color:#8C8C96;font:400 12px 'Anton',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;pointer-events:none}
.pmk{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.pmk .mkd{width:32px;height:32px;border-radius:50%;border:2px solid #5A5A64;background:#18181D;color:#E6E6EA;font:400 15px/1 'Anton',sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.6);transition:transform .15s ease,background-color .15s ease}
.pmk:hover .mkd{transform:scale(1.1);border-color:#8C8C96}
.pmk.lug .mkd{border-radius:8px}
.pmk.on{z-index:2}
.pmk.on .mkd{width:38px;height:38px;background:#D9232D;border:3px solid #fff;color:#fff;box-shadow:0 0 0 8px rgba(217,35,45,.25),0 0 22px 4px rgba(217,35,45,.5)}
.plan-cap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.elist{display:flex;flex-direction:column;gap:6px}
.mkb{width:30px;height:30px;border-radius:50%;border:2px solid #5A5A64;background:#18181D;display:inline-flex;align-items:center;justify-content:center;font:400 13px/1 'Anton',sans-serif;flex:none}
.mkb.lug{border-radius:8px}
@media (prefers-reduced-motion: reduce){.pg *,.pg *::before,.pg *::after,.main{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div class="pg">

<!-- ================= MENÚ LATERAL (el del sistema de gestión, con la sección nueva) ================= -->
<aside class="side" aria-label="Menú del sistema">
<img src="assets/logo.png" alt="Gálatas Gym" style="width: 150px; height: auto; display: block; margin: 0 auto 10px">
<p class="sec-t">Gestión</p>
<button class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Tablero</button>
<button class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Agenda</button>
<button class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3 2.2 3.5 5"></path></svg>Socios</button>
<button class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10M7 12h10M7 17h6"></path><rect x="3" y="3" width="18" height="18" rx="2"></rect></svg>Planes personalizados</button>
<button class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profesores</button>
<button class="ni"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="3"></circle><circle cx="16" cy="9" r="3"></circle><path d="M2 20c.8-3 3-4.5 6-4.5s5.2 1.5 6 4.5M14 15.6c.6-.1 1.3-.1 2-.1 3 0 5.2 1.5 6 4.5"></path></svg>Equipo</button>
<p class="sec-t">App de rutinas</p>
<button :class="navCls.pedidos" @click="go.navPedidos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"></path><path d="M8 9h8M8 12h5"></path></svg>Pedidos<span class="badge">{{kpi.pend}}</span></button>
<button :class="navCls.rutinas" @click="go.navRutinas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>Rutinas</button>
<template v-if="conIa">

<td style="font-weight: 600">{{c.name}}</td>
<td><div class="strip"><template v-for="o in c.objs"><span class="tag">{{o}}</span></template></div></td>
<td>{{c.dias}}</td>
<td>{{c.esf}}</td>
<td style="text-align: right"><button class="btn sec sm" @click="c.edit">Editar</button></td>
</tr>
</template>
</tbody>
</table>
</div>
</div>
</template>

<!-- ---------- IMPORTAR RUTINA DESDE PDF O WORD ---------- -->
<template v-if="is.importar">
<button class="back" style="align-self: flex-start" @click="go.impBack"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>{{imp.backTxt}}</button>
<div style="display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow">{{imp.eyebrow}}</p>
<h1 class="h1">Importar rutina</h1>
<p class="mu" style="max-width: 760px">Subí una rutina que ya tengas en PDF o Word. La IA la lee y la pasa al formato de la app; vos la revisás en el editor antes de guardarla.</p>
</div>
<div class="grid2">
<div class="colL">
<div class="drop">
<span style="width: 56px; height: 56px; border-radius: 14px; background: #2A0C0F; color: #F0414A; border: 1px solid #7A1A20; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg></span>
<p class="h3">Arrastrá el archivo acá</p>
<p class="mu sm">PDF o Word (.docx), hasta 10 MB</p>
<button class="btn sec sm">Elegir archivo</button>
</div>
<div class="card" style="display: flex; flex-direction: column; gap: 10px">
<p class="subt">Archivos de prueba (demo)</p>
<template v-for="f in impFiles">
<div class="rule"><span class="mkb lug" style="width: 36px; height: 36px; font-size: 11px">{{f.ext}}</span><div style="flex: 1; min-width: 0"><p class="p" style="font-weight: 600">{{f.name}}</p><p class="mu sm">{{f.sub}}</p></div><button class="btn pri sm" @click="f.go">Importar</button></div>
</template>
</div>
</div>
<div class="colR">
<div class="card" style="display: flex; flex-direction: column; gap: 10px">
<p class="eyebrow">Cómo funciona</p>
<div class="chk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FD6A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><p class="p sm">Reconoce ejercicios, series, repeticiones, descansos y notas, aunque cada archivo tenga otro formato.</p></div>
<div class="chk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FD6A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><p class="p sm">Busca cada ejercicio en la biblioteca y te marca los que no encuentra.</p></div>
<div class="chk"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FD6A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><p class="p sm">No se guarda nada hasta que lo revisás.</p></div>
<p class="mu sm" style="border-top: 1px solid #222227; padding-top: 10px; margin: 0">{{imp.costo}}</p>
</div>
</div>
</div>
</template>

<!-- ---------- MÉTODO GÁLATAS (modos con IA) ---------- -->
<template v-if="is.metodo">
<div style="display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow">Rutinas · IA</p>
<h1 class="h1">Método Gálatas</h1>
<p class="mu" style="max-width: 760px">Las reglas para que la IA le de las rutinas a los socios.</p>
</div>
<p class="note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.01"></path></svg><span>La IA solo propone: nada le llega al socio sin que un profe lo apruebe. Usa solo ejercicios de la biblioteca y nunca recibe el nombre ni el DNI del socio.</span></p>
<div class="grid2">
<div class="colL">
<div class="card" style="display: flex; flex-direction: column; gap: 12px">
<div class="row"><p class="h2">REGLAS</p><span class="tag red">Ejemplos</span></div>
<p class="mu sm">Escribirlas como si se las dijeras a un profe nuevo</p>
<template v-for="r in rules">
<div class="rule"><span class="secn">{{r.n}}</span><p class="p" style="flex: 1">{{r.txt}}</p><button class="del" :aria-label="`Quitar regla ${r.n}`" @click="r.del"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
</template>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<input class="inp" style="flex: 1 1 320px; width: auto" aria-label="Nueva regla" placeholder="Ej: a los mayores de 60, nada de saltos" :value="newRule" @input="go.setRule">
<button class="btn sec" @click="go.addRule">Agregar regla</button>
</div>
</div>
<div class="card" style="display: flex; flex-direction: column; gap: 12px">
<div class="row"><p class="h2">Rutinas de ejemplo</p><div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn sec sm" @click="go.importarMet"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5"></path><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"></path></svg>Importar PDF o Word</button><button class="btn sec sm" @click="go.catNew">Armar en el editor</button></div></div>
<p class="mu sm">Rutinas reales armadas previamente. La IA las toma como referencia de estilo: cómo ordena, cuántas series, qué notas deja.</p>
<template v-for="c in cat">
<div class="rule" style="padding: 10px 12px"><div style="flex: 1; min-width: 0"><p class="p" style="font-weight: 600">{{c.name}}</p><p class="mu sm">{{c.para}}</p></div><button class="btn sec sm" @click="c.edit">Ver</button></div>
</template>
</div>
</div>
<div class="colR">
<div class="card" style="display: flex; flex-direction: column; gap: 10px">
<p class="eyebrow">Biblioteca de ejercicios</p>
<p class="p"><span style="font: 700 28px 'Barlow Condensed', sans-serif">{{libCount}}</span> ejercicios del gimnasio</p>
<p class="mu sm">La IA solo elige de esta lista. Cada ejercicio ya tiene dónde se hace y su video.</p>
<button class="btn ghost" style="align-self: flex-start" @click="go.navEjercicios">Ver ejercicios →</button>
</div>
</div>
</div>
</template>

<!-- ---------- EJERCICIOS (biblioteca) ---------- -->
<template v-if="is.ejercicios">
<div class="row" style="align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 8px">
<p class="eyebrow">App de rutinas</p>
<h1 class="h1">Ejercicios</h1>
<p class="mu" style="max-width: 760px">La biblioteca del gimnasio. Cada ejercicio tiene dónde se hace y su video: es lo que ve el socio al abrirlo en su rutina.</p>
</div>
<button class="btn pri" @click="go.exNew"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Nuevo ejercicio</button>
</div>
<div class="strip">
<span class="tag">{{exStats.total}} ejercicios</span>
<span class="tag ok">Videos cargados: {{exStats.conVideo}}</span>
<span class="tag warn">Faltan grabar: {{exStats.sinVideo}}</span>
</div>
<div class="grid2">
<div class="colL">
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
<input class="inp" style="flex: 1 1 220px; width: auto" aria-label="Buscar ejercicio" placeholder="Buscar ejercicio" :value="exQ" @input="go.setExQ">
<div class="chips"><template v-for="o in exFilters"><button :class="o.cls" @click="o.pick">{{o.label}}</button></template></div>
</div>
<div class="tblbox">
<table>
<thead><tr><th>Ejercicio</th><th>Grupo</th><th>Dónde se hace</th><th>Video</th><th></th></tr></thead>
<tbody>
<template v-for="x in exRows">
<tr :class="x.cls">
<td style="font-weight: 600">{{x.name}}</td>
<td class="mu">{{x.g}}</td>
<td><span style="display: inline-flex; align-items: center; gap: 8px"><span :class="x.mkCls" style="width: 26px; height: 26px; font-size: 11px">{{x.locId}}</span>{{x.locName}}</span></td>
<td><span :class="x.vCls">{{x.vTxt}}</span></td>
<td style="text-align: right"><button class="btn sec sm" @click="x.edit">Editar</button></td>
</tr>
</template>
</tbody>
</table>
</div>
</div>
<div class="colR">
<template v-if="exf.show">
<div class="card" style="display: flex; flex-direction: column; gap: 14px">
<div class="row"><p class="h2">{{exf.title}}</p><button class="del" aria-label="Cerrar" @click="go.exClose"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div><label class="lbl" for="ex-n">Nombre</label><input id="ex-n" class="inp" :value="exf.name" @input="go.exSetName" placeholder="Ej: Hip thrust con barra"></div>
<div><label class="lbl" for="ex-g">Grupo muscular</label><select id="ex-g" class="inp" :value="exf.g" @input="go.exSetG"><template v-for="o in grupos"><option :value="o">{{o}}</option></template></select></div>
<div><label class="lbl" for="ex-l">Dónde se hace</label><select id="ex-l" class="inp" :value="exf.loc" @input="go.exSetLoc"><template v-for="o in locOpts"><option :value="o.v">{{o.l}}</option></template></select>
<p class="mu sm" style="margin-top: 6px">Las máquinas y los lugares se cargan en Plano y máquinas.</p></div>
<div><label class="lbl" for="ex-v">Video</label><input id="ex-v" class="inp" :value="exf.video" @input="go.exSetVideo" placeholder="Link de YouTube (no listado)"></div>
<div><label class="lbl" for="ex-t">Notas técnicas</label><textarea id="ex-t" class="inp" style="min-height: 80px" placeholder="Lo que el socio lee antes de hacerlo"></textarea></div>
<div style="display: flex; gap: 10px"><button class="btn pri" @click="go.exSave">Guardar</button><button class="btn ghost" @click="go.exClose">Cancelar</button></div>
</div>
</template>
<template v-if="exf.hide">
<div class="card" style="display: flex; flex-direction: column; gap: 10px">
<p class="eyebrow">Cómo cargar los videos</p>
<p class="p sm">Grabalos con el celu, subilos a YouTube como «no listado» y pegá el link en el ejercicio.</p>
<p class="mu sm">Un video no listado no aparece en búsquedas: solo lo ve quien tiene el link, que en este caso es la app. Y no ocupa espacio en el servidor del gimnasio.</p>
</div>
</template>
</div>
</div>
</template>

// props, state, setState, forceUpdate y los eventos de ciclo de vida.
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) {
    if (typeof patch === 'function') patch = patch(this.state, this.props);
    if (this.__mark) this.__mark();     // guarda cómo estaba el state, para componentDidUpdate
    Object.assign(this.state, patch);   // el state es reactivo: Vue redibuja solo
  }
  // Redibuja aunque el state no cambie (lo usa el reloj del Modo entrenar)
  forceUpdate() { if (this.__force) this.__force(); }
}

          self.setState({ view: 'editor', edMode: 'imp', edTitle: fi.title, impName: fi.name, ed: days, edDay: 0, missing: fi.missing.map(function (m) { return m.item[1]; }) });
        } };
      }),
      rules: st.rules.map(function (t, i) {
        return { n: String(i + 1).padStart(2, '0'), txt: t, del: function () { self.setState({ rules: st.rules.filter(function (_, j) { return j !== i; }) }); } };
      }),
      newRule: st.newRule,
      libCount: st.ex.length,
      exRows: exRows, exQ: st.exQ, exf: exf, grupos: GRUPOS,
      exStats: { total: st.ex.length, conVideo: conVideo, sinVideo: st.ex.length - conVideo },
      exFilters: fl.map(function (x) { return { label: x, cls: 'chip' + (st.exF === x ? ' on' : ''), pick: set({ exF: x }) }; }),
      locOpts: PLACES.map(function (p) { return { v: String(p.id), l: placeLabel(p) }; }),
      pl: pl,
      libQ: st.libQ,
      onQ: function (e) { self.setState({ libQ: e.target.value }); },
      libFilters: fl.map(function (x) { return { label: x, cls: 'chip' + (st.libF === x ? ' on' : ''), pick: set({ libF: x }) }; }),
      lib: lib,
      // "Partir de": cualquier rutina del catálogo o en blanco (solo en el plan personalizado)
      tpls: CAT.map(function (c) { return [c.id, c.name, c.tpl]; }).concat([['blank', 'En blanco', 'blank']]).map(function (t) {
        return { label: t[1], cls: 'chip' + (st.edFrom === t[0] ? ' on' : ''), pick: function () { self.setState({ edFrom: t[0], ed: fromTpl(t[2]), edDay: 0 }); } };
      }),
      dayTabs: st.ed.map(function (x, i) { return { label: 'Día ' + (i + 1), cls: 'dtab' + (i === di ? ' on' : ''), pick: set({ edDay: i }) }; }),
      day: {
        title: d.title, focus: d.focus, fin: d.fin, groups: groups, empty: d.items.length === 0,
        onTitle: function (e) { var val = e.target.value; self.updDay(function (dd) { dd.title = val; return dd; }); },
        onFocus: function (e) { var val = e.target.value; self.updDay(function (dd) { dd.focus = val; return dd; }); },
        onFin: function (e) { var val = e.target.value; self.updDay(function (dd) { dd.fin = val; return dd; }); }
      },
      edx: edx,
      toast: toast,
      go: {
        // Menú
        navPedidos: set({ view: 'bandeja' }),
        navRutinas: set({ view: 'catalogo' }),
        navMetodo: set({ view: 'metodo' }),
        navEjercicios: set({ view: 'ejercicios' }),
        navPlano: set({ view: 'plano' }),
        // Interruptor de la demo. Sin IA no hay Método: si estabas ahí, vuelve a Rutinas.
        modoMan: function () { self.setState({ modo: 'man', view: st.view === 'metodo' ? 'catalogo' : st.view }); },
        modoComb: set({ modo: 'comb' }),
        modoIa: set({ modo: 'ia' }),
        fPend: set({ filtro: 'pend' }), fPago: set({ filtro: 'pago' }), fRes: set({ filtro: 'res' }),
        asignarme: function () { self.setReq(q.id, { asig: 'Diego S.' }); },
        // Alta con lesión
        revisada: function () { self.resolver(q, {}, 'Adaptación revisada', 'Un profe revisó tu rutina de adaptación por la lesión que nos contaste.'); },
        editAlta: function () { self.setState({ view: 'editor', edMode: 'alta', ed: fromTpl('suave'), edDay: 0, missing: [] }); },
        // Plan personalizado
        pagado: function () {
          self.setState({
            reqs: st.reqs.map(function (r) { return r.id === q.id ? Object.assign({}, r, { estado: 'pend' }) : r; }),
            toast: { t: 'Pago confirmado', d: q.name + ' pasó a Por atender. Ya podés armar su plan.' }
          });
        },
        armar: function () { self.setState({ view: 'editor', edMode: 'perso', edFrom: 'fb3', ed: fromTpl('full'), edDay: 0, missing: [] }); },
        noRenovo: function () {
          self.setState({
            reqs: st.reqs.map(function (r) { return r.id === q.id ? Object.assign({}, r, { venc: true, actual: 'Plan personalizado (última versión)' }) : r; }),
            toast: { t: q.name + ' no renovó el plan', d: 'Conserva su última rutina y vuelve a poder pedir cambios gratis.' }
          });
        },
        toggleAll: function () {
          var so = Object.assign({}, st.secOpen);
          SECS.forEach(function (s) { so[q.id + '-' + s.n] = !allOpen; });
          self.setState({ secOpen: so });
        },
        // Borrador de IA
        regen: function () { self.setState({ regen: st.regen + 1, aiDay: 0, toast: { t: 'Borrador regenerado', d: 'La IA armó una versión nueva con las mismas reglas.' } }); },
        editDraft: function () { self.setState({ view: 'editor', edMode: 'ia', ed: fromDays(aiDays(q.id)), edDay: 0, missing: [] }); },
        aprobarIa: function () { self.resolver(q, { asignada: ac.title + ' (IA, revisada)', actual: ac.title }, 'Rutina enviada a ' + q.name, 'Ya tenés tu rutina nueva: ' + ac.title + '.'); },
        // Rutinas e importación
        catNew: function () { self.setState({ view: 'editor', edMode: 'cat', edTitle: '', ed: fromTpl('blank'), edDay: 0, missing: [] }); },
        importarCat: set({ view: 'importar', impFrom: 'catalogo' }),
        importarMet: set({ view: 'importar', impFrom: 'metodo' }),
        impBack: function () { self.setState({ view: st.impFrom }); },
        // Método
        setRule: function (e) { self.setState({ newRule: e && e.target ? e.target.value : '' }); },
        addRule: function () {
          var t = (st.newRule || '').trim();
          if (t) self.setState({ rules: st.rules.concat([t]), newRule: '' });
        },
        // Ejercicios
        setExQ: function (e) { self.setState({ exQ: e && e.target ? e.target.value : '' }); },
        exNew: set({ exSel: 'new', exForm: { name: '', g: 'Piernas', loc: '1', video: '' } }),
        exClose: set({ exSel: null, exForm: null }),
        exSetName: setEf('name'), exSetG: setEf('g'), exSetLoc: setEf('loc'), exSetVideo: setEf('video'),
        exSave: function () {
          var fm = st.exForm; if (!fm || !fm.name.trim()) return;
          var loc = isNaN(Number(fm.loc)) ? fm.loc : Number(fm.loc);
          var item = { name: fm.name.trim(), g: fm.g, loc: loc, video: fm.video.trim() };
          var ex = st.exSel === 'new' ? st.ex.concat([item]) : st.ex.map(function (x, i) { return i === st.exSel ? item : x; });
          self.setState({ ex: ex, exSel: null, exForm: null, toast: { t: 'Ejercicio guardado', d: item.name + ' · ' + placeLabel(placeById(loc)) + (item.video ? ' · con video' : ' · falta el video') } });
        },
        // Plano: tocar el croquis ubica el elemento elegido (en la escala del celular)
        placeAt: function (e) {
          if (!st.plSel || !e || !e.currentTarget) return;
          if (e.target && e.target.closest && e.target.closest('.pmk')) return;
          var rc = e.currentTarget.getBoundingClientRect();
          var x = Math.round((e.clientX - rc.left) / rc.width * 340), y = Math.round((e.clientY - rc.top) / rc.height * 420);
          var pos = Object.assign({}, st.pos); pos[st.plSel] = { x: Math.max(20, Math.min(320, x)), y: Math.max(20, Math.min(400, y)) };
          var p = placeById(st.plSel);
          self.setState({ pos: pos, plSel: null, toast: { t: placeLabel(p) + ' ubicada', d: 'Así la va a ver el socio en el plano de la app.' } });
        },
        addMaq: set({ toast: { t: 'Nueva máquina', d: 'Le ponés nombre y zona, y después la ubicás en el croquis. Toma el número 16.' } }),
        addLugar: set({ toast: { t: 'Nuevo lugar', d: 'Para ejercicios sin máquina fija. Toma la letra D.' } }),
        cambiarCroquis: set({ toast: { t: 'Actualizar plano', d: 'Cargás la planilla de medidas actualizada y el plano se vuelve a dibujar a escala. Si mueven una máquina, alcanza con cambiar su fila. Las máquinas mantienen su número.' } }),
        imprimirQr: set({ toast: { t: 'QR listos para imprimir', d: 'Se generó un PDF con un QR por máquina, con su número y nombre, para pegar en cada una.' } }),
        // Editor
        edBack: function () {
          var back = { cat: 'catalogo', imp: 'importar' }[st.edMode] || 'detalle';
          self.setState({ view: back, missing: [] });
        },
        borrador: set({ toast: { t: 'Borrador guardado', d: 'Podés seguir después desde el pedido.' } }),
        addDay: function () { var ed = st.ed.slice(); ed.push({ title: 'Día ' + (ed.length + 1), focus: '', fin: '', items: [] }); self.setState({ ed: ed, edDay: ed.length - 1 }); },
        guardar: function () {
          var m = st.edMode;
          if (m === 'cat' || m === 'imp') {
            if (m === 'imp' && st.missing.length) { self.setState({ toast: { t: 'Faltan ejercicios en la biblioteca', d: 'Agregalos o quitalos antes de guardar.' } }); return; }
            self.setState({ view: st.impFrom === 'metodo' && m === 'imp' ? 'metodo' : 'catalogo', toast: { t: 'Rutina guardada', d: (st.edTitle || 'La rutina') + ' ya está disponible.' } });
            return;
          }
          if (m === 'alta') { self.resolver(q, {}, 'Adaptación ajustada', 'Un profe ajustó tu rutina de adaptación por la lesión que nos contaste.'); return; }
          if (m === 'perso') { self.resolver(q, { asignada: 'Plan personalizado', actual: 'Plan personalizado' }, 'Plan enviado a ' + q.name, 'Tu plan personalizado ya está listo.'); return; }
          var nombre = m === 'ia' ? ac.title + ' (IA, ajustada)' : st.edTitle + ' (ajustada)';
          self.resolver(q, { asignada: nombre, actual: nombre }, 'Rutina asignada a ' + q.name, 'Ya tenés tu rutina nueva.');
        },
        hideToast: set({ toast: null })
      }
    };
  }
}
</script>
<script>
// Arranque: el state pasa a ser reactivo y renderVals() se recalcula cuando cambia.
(function () {
  var V = Vue;
  var inst = new Component({});
  inst.state = V.reactive(inst.state);
  var tick = V.ref(0);      // sube con forceUpdate y obliga a recalcular renderVals()
  var version = V.ref(0);   // sube con cada cambio, para avisar componentDidUpdate
  var prev = null;
  inst.__mark = function () {
    if (!prev) prev = Object.assign({}, inst.state);
    version.value++;
  };
  inst.__force = function () { inst.__mark(); tick.value++; };
  var vals = V.computed(function () { tick.value; return inst.renderVals(); });
  var keys = Object.keys(inst.renderVals());
  V.createApp({
    template: '#tpl',
    setup: function () {
      var out = {};
      keys.forEach(function (k) { out[k] = V.computed(function () { return vals.value[k]; }); });
      // Después de que Vue actualiza la pantalla, igual que React
      V.watch(version, function () {
        var p = prev; prev = null;
        if (inst.componentDidUpdate) inst.componentDidUpdate(inst.props, p || {});
      }, { flush: 'post' });
      V.onMounted(function () { if (inst.componentDidMount) inst.componentDidMount(); });
      V.onBeforeUnmount(function () { if (inst.componentWillUnmount) inst.componentWillUnmount(); });
      return out;
    }
  }).mount('#app');
})();
</script>
